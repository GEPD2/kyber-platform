# HTTPS-only virtual host. There is no plain-HTTP listener at all: port 80 is
# neither served here nor published by docker-compose, so nothing travels in
# clear text. Certificates: ./nginx/certs/ (scripts/gen_certs.py creates a
# local self-signed pair; ./scripts/start.py does it automatically if missing).

server {
    # 8443 inside the container (non-root nginx cannot bind 443); published as 443.
    listen 8443 ssl;
    http2 on;
    server_name _;

    # ── TLS 1.3 only ─────────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols             TLSv1.3;
    ssl_prefer_server_ciphers off;

    # TLS 1.3 does not need explicit cipher list — it has its own mandatory set:
    #   TLS_AES_128_GCM_SHA256, TLS_AES_256_GCM_SHA384, TLS_CHACHA20_POLY1305_SHA256
    # The line below is for nginx TLS 1.3 session tickets:
    ssl_session_timeout       1d;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_tickets       off;   # disable — use session IDs instead

    # Local self-signed setup (scripts/gen_certs.py): no HSTS and no OCSP stapling.
    #   HSTS on "localhost" would make the browser force HTTPS on EVERY
    #   localhost port (other local apps included) for as long as max-age.
    #   OCSP stapling needs a CA-issued certificate and an outbound resolver.
    # With a real domain and a CA-signed (e.g. Let's Encrypt) certificate, add:
    #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #   ssl_stapling on; ssl_stapling_verify on; resolver 1.1.1.1 valid=300s;

    # ── Security headers (same as HTTP) ──────────────────────────────────────
    add_header X-Frame-Options            "DENY"                always;
    add_header X-Content-Type-Options     "nosniff"             always;
    add_header X-XSS-Protection           "1; mode=block"       always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "geolocation=(), camera=(), microphone=()" always;
    # One line: header values must not contain newlines (HTTP/2 rejects them).
    add_header Content-Security-Policy "default-src 'self'; script-src $csp_script; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    # ── Rate limiting ─────────────────────────────────────────────────────────
    limit_req zone=general burst=20 nodelay;
    limit_conn addr 20;

    # Static frontend (Next.js export). Only `expires` here: an add_header in a
    # location would drop every server-level security header for that response.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
        expires -1;
    }

    location /_next/static/ {
        try_files $uri =404;
        expires max;
    }

    error_page 404 /404.html;

    # ── API proxy ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection        "";
        proxy_read_timeout  30s;
        proxy_buffering     off;
    }

    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass       http://backend;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/api/challenges/(submit|hint)$ {
        limit_req zone=submit burst=10 nodelay;
        proxy_pass       http://backend;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ /\.  { deny all; return 404; }
    location ~ ~$   { deny all; return 404; }
    location ~* (\.php|\.asp|\.aspx|\.jsp)$ { return 404; }
}
