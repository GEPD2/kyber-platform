# ─────────────────────────────────────────────────────────────────────────────
#  Nginx main config — CRYSTALS-Kyber Training Platform
#  HTTPS only: conf.d/app.conf listens on 8443 inside the container, published
#  as host port 443 (TLS 1.3); there is no port-80 listener.
#  The image (owasp/modsecurity-crs) runs nginx as the non-root user nginx, so
#  the pid file and temp paths live in /tmp and logs go to stdout/stderr.
# ─────────────────────────────────────────────────────────────────────────────

# Web application firewall: ModSecurity v3 with the OWASP Core Rule Set.
load_module modules/ngx_http_modsecurity_module.so;

worker_processes  auto;
error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    proxy_temp_path       /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # ── WAF ──────────────────────────────────────────────────────────────────
    # Rules: CRS 4 at paranoia level 1, settings from the environment in
    # docker-compose.yml. Exclusions for the answer field:
    # nginx/modsecurity/kyber-exclusions.conf.
    modsecurity on;
    modsecurity_rules_file /etc/modsecurity.d/setup.conf;

    # $csp_script: 'self' plus the hash of every inline script of the build,
    # generated by frontend/scripts/csp-hashes.mjs.
    include /etc/nginx/csp/csp_script.conf;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    access_log /dev/stdout main;

    # ── Performance ──────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss;

    # ── Security: hide nginx version ─────────────────────────────────────────
    server_tokens off;

    # ── Rate limiting zones ──────────────────────────────────────────────────
    # General requests: 100r/m per IP
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/m;
    # Auth endpoints: 10r/m per IP (brute-force protection)
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=10r/m;
    # Answer submit: 30r/m per IP
    limit_req_zone $binary_remote_addr zone=submit:10m  rate=30r/m;

    # ── Connection limits ────────────────────────────────────────────────────
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # ── Client body limits ───────────────────────────────────────────────────
    client_max_body_size 64k;     # answers are small
    client_body_timeout  10s;
    client_header_timeout 10s;

    # ── Upstream: FastAPI backend ─────────────────────────────────────────────
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
