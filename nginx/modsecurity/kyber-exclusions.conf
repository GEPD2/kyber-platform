# OWASP CRS exclusions for the Kyber platform (loaded before the CRS rules).
#
# The answer field of POST /api/challenges/submit carries C, Python and shell
# commands by design (the Lab level asks for `sudo usermod -aG dialout $USER`,
# `. $HOME/esp/esp-idf/export.sh`, ...). Those look exactly like the attacks the
# CRS hunts for, so only that one JSON field on that one endpoint skips the
# code-injection rule families. Every other field and endpoint, login and
# registration included, keeps the full rule set. The backend validates the
# answer itself (length limit, allow-lists, no code is ever executed).
#
# Add an exclusion: find the rule id in the audit log (docker compose logs nginx,
# "ruleId"), then narrow it to one target with ctl:ruleRemoveTargetById.
# Rule ids 10000-10999 are reserved for this file.

SecRule REQUEST_FILENAME "@streq /api/challenges/submit" \
    "id:10001,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.answer,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:json.answer,\
    ctl:ruleRemoveTargetByTag=attack-injection-generic;ARGS:json.answer,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.answer,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.answer"

# 920350 flags a numeric Host header (https://127.0.0.1 is an allowed origin of
# this local setup). Re-enable it when the site is served under a real domain.
SecRuleRemoveById 920350
