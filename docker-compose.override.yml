#  docker-compose.override.yml — development overrides
#  This file is loaded automatically alongside docker-compose.yml in dev.
#  Do NOT use in production — it removes :ro mounts and enables hot-reload.
#  In production: docker compose -f docker-compose.yml up -d
services:
  backend:
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/app
      --log-level debug
    volumes:
      - ./backend/app:/app/app   # writable for hot-reload (no :ro)
    environment:
      - APP_ENV=development
      - DEBUG=true

  mysql:
    ports:
      # loopback only; host port 3307 so a local MySQL on 3306 does not clash
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"

  redis:
    ports:
      # loopback only; host port 6380 so a local Redis on 6379 does not clash
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
